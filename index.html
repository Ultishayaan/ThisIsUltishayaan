<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Is Ultishayaan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e6e8ef;
      display: grid; place-items: center;
    }
    .card {
      background: #161a23;
      border: 1px solid #2b3142;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    .subtitle { color: #a4abbe; margin-bottom: 2rem; }
    .links { display: flex; flex-direction: column; gap: 1rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.75rem; padding: 1rem 1.5rem;
      border-radius: 10px; font-size: 1.1rem; font-weight: 600;
      text-decoration: none; color: white;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn:active { transform: translateY(0); }
    .ask { background: #3b82f6; }
    .mine { background: #f97316; }
    .gh { background: #24292e; }
    .gh:hover { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h1>This Is Ultishayaan</h1>
    <p class="subtitle">My web projects</p>
    <div class="links">
      <a class="btn ask" href="https://explosiveeducation.onrender.com" target="_blank">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        Explosive Education
      </a>
      <a class="btn mine" href="http://localhost:3001/" target="_blank">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <path d="M8 21h8"></path>
          <path d="M12 17v4"></path>
        </svg>
        Minceraft+ — GameHub LAN
      </a>
      <a class="btn gh" href="https://github.com/Ultishayaan" target="_blank">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

</body>
</html>
